[build-system]
requires = ["setuptools>=83", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "apolo-extras"
description = "Tools and commands extending the Apolo CLI"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "apolo-cli>=26.11.2",
    "apolo-sdk>=26.11.2",
    "click>=8.4",
    "pyyaml>=6.0",
    "toml>=0.10.0",
]
dynamic = ["version"]

[tool.poetry]
requires-poetry = ">=2.4.1"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"

[tool.poetry.group.build]
optional = true

[tool.poetry.group.build.dependencies]
build = "1.6.1"
setuptools = "84.2.1"
wheel = ">=0.45"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
mypy = "2.4.1"
pre-commit = "4.7.0"
types-PyYAML = "6.0.12.20261103"
types-toml = "0.10.8.20260518"
pytest = "9.1.1"
pytest-asyncio = "1.4.1.post1"
pytest-clarity = "1.0.1"
pytest-xdist = "3.8.0"
tenacity = "9.2.1"
towncrier = "26.9.0"
typing-extensions = "4.16.0"

[tool.poetry.group.cleanup]
optional = true

[tool.poetry.group.cleanup.dependencies]
aiohttp = "3.14.5"

[project.urls]
Homepage = "https://github.com/neuro-inc/apolo-extras"

[project.scripts]
apolo-extras = "apolo_extras:main"

[project.entry-points.apolo_api]
apolo-extras = "apolo_extras:setup_plugin"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
version = {attr = "apolo_extras.version.__version__"}

[tool.setuptools.packages.find]
include = ["apolo_extras*"]
namespaces = true

[tool.setuptools.package-data]
apolo_extras = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
log_level = "INFO"
filterwarnings = [
    "error",
    "ignore:.*PROTOCOL_TLS is deprecated:DeprecationWarning:apolo_sdk",
    "ignore:.*PROTOCOL_TLS is deprecated:DeprecationWarning:tests",
    "ignore:.*PROTOCOL_TLS is deprecated:DeprecationWarning:aiohttp",
    "ignore:returning HTTPException object is deprecated.+:DeprecationWarning:aiodocker",
    "ignore:ssl_context is deprecated.+:DeprecationWarning:aiodocker",
    "ignore:the imp module is deprecated.+:DeprecationWarning:past",
    "ignore:Flags not at the start of the expression.+:DeprecationWarning:cookiecutter",
    "ignore:Using or importing the ABCs from 'collections' instead of from 'collections.abc' is deprecated, and in 3.8 it will stop working:DeprecationWarning:jinja2",
    "ignore:(rm_rf) error removing.+:UserWarning:pytest",
    "ignore::ResourceWarning:asyncio",
    "ignore::UserWarning:_pytest",
    "ignore:.*Inheritance class AuthorizedSession from ClientSession is discouraged:DeprecationWarning:google",
]
markers = [
    "serial: run these tests non-parallel",
    "smoke: run these tests during smoke testing",
    "smoke_only: run these tests only during smoke testing",
]

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
follow_imports = "silent"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["setuptools", "pytest", "_pytest.*", "jose"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["F541"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-third-party = ["aiohttp", "apolo_cli", "apolo_sdk", "click", "pytest"]

[tool.towncrier]
    package = "apolo_extras"
    package_dir = "."
    directory = "CHANGELOG.D"
    filename = "CHANGELOG.md"
    template = "CHANGELOG.D/towncrier_template.md"
    issue_format = "[#{issue}](https://github.com/neuro-inc/apolo-extras/issues/{issue})"
    start_string = "[comment]: # (towncrier release notes start)\n"

    [[tool.towncrier.type]]
        directory = "feature"
        name = "Features"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "bugfix"
        name = "Bugfixes"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "doc"
        name = "Improved Documentation"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "removal"
        name = "Deprecations and Removals"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "misc"
        name = "Misc"
        showcontent = false
