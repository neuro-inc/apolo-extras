name: CD

on:
  release:
    types: [published]

jobs:
  pypi_deploy:
    name: Release package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/apolo-extras
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout commit
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements/build.txt
      - name: Install build dependencies
        run: make setup-build
      - name: Sanity check for tag and version
        id: version
        shell: bash
        run: |
          VERSION=$(python apolo_extras/version.py)
          if [ "${{ github.ref }}" != "refs/tags/v$VERSION" ]
          then
            echo "Git tag '${{ github.ref }}' differs from package version 'v$VERSION'"
            exit 1
          fi
          echo "OK, git tag matches package version: 'v$VERSION'"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Make dists
        run: make build
      - name: PyPI upload
        uses: pypa/gh-action-pypi-publish@release/v1

  image_deploy:
    name: Release image if needed
    runs-on: ubuntu-latest
    needs: [pypi_deploy]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout commit
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Wait until package becomes available on PyPI
        timeout-minutes: 5
        run: |
          PYPIVERSION=$(python apolo_extras/version.py)
          PYPIPACKAGE="apolo-extras==$PYPIVERSION"
          until python -m pip install --no-cache-dir "$PYPIPACKAGE"
          do
              echo "Waiting for the pypi package $PYPIPACKAGE ..."
              sleep 1
          done
      - name: Build release image
        run: |
          export PACKAGE="apolo-extras==${{ needs.pypi_deploy.outputs.version }}"
          docker build -t ghcr.io/neuro-inc/apolo-extras:latest \
            --build-arg APOLO_EXTRAS_PACKAGE=$PACKAGE .
      - name: Login to ghcr.io
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push release image
        id: push
        run: |
          export IMAGE=ghcr.io/neuro-inc/apolo-extras
          export TAG=${{ needs.pypi_deploy.outputs.version }}

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          docker tag $IMAGE:latest $IMAGE:$TAG
          docker push $IMAGE:$TAG
          # Only final releases update latest; alpha, beta, and RC releases do not.
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            docker push $IMAGE:latest
          fi
      - name: Wait until image becomes available on GHCR
        timeout-minutes: 10
        run: |
          export IMAGE=${{ steps.push.outputs.image }}
          export TAG=${{ steps.push.outputs.tag }}

          until docker pull --quiet $IMAGE:$TAG
          do
              echo "Waiting for the GHCR image $IMAGE:$TAG ..."
              sleep 1
          done
