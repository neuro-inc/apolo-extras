name: CD

on:
  push:
    branches: [master]

jobs:
  prepare:
    name: Validate release notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Checkout commit and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Check version and changelog
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git diff --quiet "$BEFORE" "$GITHUB_SHA" -- apolo_extras/version.py; then
            echo "Version unchanged; skipping release"
            exit 0
          fi
          VERSION=$(python apolo_extras/version.py)
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            echo "Version v$VERSION is already tagged; skipping release"
            exit 0
          fi
          make check-changelog
          echo "release=true" >> "$GITHUB_OUTPUT"

  pypi_deploy:
    name: Release package
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/apolo-extras
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout commit
        uses: actions/checkout@v7
      - name: Setup Python
        uses: neuro-inc/reuse/.github/actions/setup-python-poetry@v26.8.0
      - name: Install build dependencies
        run: make setup-build
      - name: Read package version
        id: version
        shell: bash
        run: |
          VERSION=$(python apolo_extras/version.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Make dists
        run: make build
      - name: PyPI upload
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Allow retrying after a later image or GitHub release step fails.
          skip-existing: true

  image_deploy:
    name: Release image if needed
    runs-on: ubuntu-latest
    needs: [pypi_deploy]
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout commit
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Wait until package becomes available on PyPI
        timeout-minutes: 5
        run: |
          PYPIVERSION=$(python apolo_extras/version.py)
          PYPIPACKAGE="apolo-extras==$PYPIVERSION"
          until python -m pip install --no-cache-dir "$PYPIPACKAGE"
          do
              echo "Waiting for the pypi package $PYPIPACKAGE ..."
              sleep 1
          done
      - name: Build release image
        run: |
          export PACKAGE="apolo-extras==${{ needs.pypi_deploy.outputs.version }}"
          docker build -t ghcr.io/neuro-inc/apolo-extras:latest \
            --build-arg APOLO_EXTRAS_PACKAGE=$PACKAGE .
      - name: Login to ghcr.io
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push release image
        id: push
        run: |
          export IMAGE=ghcr.io/neuro-inc/apolo-extras
          export TAG=${{ needs.pypi_deploy.outputs.version }}

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          docker tag $IMAGE:latest $IMAGE:$TAG
          docker push $IMAGE:$TAG
          # Only final releases update latest; alpha, beta, and RC releases do not.
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            docker push $IMAGE:latest
          fi
      - name: Wait until image becomes available on GHCR
        timeout-minutes: 10
        run: |
          export IMAGE=${{ steps.push.outputs.image }}
          export TAG=${{ steps.push.outputs.tag }}

          until docker pull --quiet $IMAGE:$TAG
          do
              echo "Waiting for the GHCR image $IMAGE:$TAG ..."
              sleep 1
          done
      - name: Create GitHub release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.pypi_deploy.outputs.version }}
        run: |
          FLAGS=()
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            FLAGS+=(--prerelease --latest=false)
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" \
            --title "apolo-extras v$VERSION" \
            --generate-notes "${FLAGS[@]}"
