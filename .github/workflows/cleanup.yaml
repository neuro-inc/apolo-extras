name: "Cleanup after CI tests"

on:
  schedule:
  - cron: 0 5 * * *


jobs:
  posttest:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout commit
      uses: actions/checkout@v7

    - name: Setup Python
      uses: neuro-inc/reuse/.github/actions/setup-python-poetry@v26.10.0
      with:
        python-version-file: .python-version

    - name: Install dependencies
      run: |
        poetry install --only cleanup

    - name: Delete test image
      env:
        GH_USERNAME: ${{ secrets.GH_CONTAINERS_CLEANUP_USERNAME }}
        GH_PASSWORD: ${{ secrets.GH_CONTAINERS_CLEANUP_PAT }}
        GH_REPO_NAME: apolo-extras
        STALE_DAYS: "7"
      run: |
        poetry run python .github/workflows/cleanup.py
